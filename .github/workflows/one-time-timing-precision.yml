name: One-time timing precision

on:
  push:
    branches: [agent/fix-repo-audit]
    paths: [.github/workflows/one-time-timing-precision.yml]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-repo-audit
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply exact timing fixes and regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f"Expected block not found in {path}; refusing broad edit")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'gex-lab/gex_lab/backtest.py',
              '''            if o > 0 and o < tgt and (not _num(ntrans) or o >= float(ntrans)):\n                pos = {"entry": o, "i0": i, "tgt": tgt,\n''',
              '''            if (o > pending["ptrans"] and o < tgt and\n                    (not _num(ntrans) or o >= float(ntrans))):\n                pos = {"entry": o, "i0": i, "tgt": tgt,\n''')

          replace_once(
              'alpaca-bot/bot/taxes.py',
              '''    for i, (ts, ret) in enumerate(r.items()):\n        current = float(h.iloc[i])\n        if current > 0 and prev <= 0:\n            entry_nav = nav\n            entry_date = ts\n        # Always apply the supplied return: an exit row can contain transaction cost\n        # even though current exposure is already zero.\n        nav *= 1.0 + ret\n        if prev > 0 and current <= 0:\n            gain = nav - entry_nav\n            rate = slovenia_rate_for_dates(entry_date, ts)\n''',
              '''    for i, (ts, ret) in enumerate(r.items()):\n        current = float(h.iloc[i])\n        # `held[t]` earns close[t-1] -> close[t]. Therefore a 0->1 or 1->0\n        # exposure transition was executed at the PRIOR close, not at row t.\n        # If the scenario begins already held, the first row is the only available\n        # acquisition date and is treated as a fresh scenario entry.\n        trade_date = r.index[i - 1] if i > 0 else ts\n        if current > 0 and prev <= 0:\n            entry_nav = nav\n            entry_date = trade_date\n        # Always apply the supplied return: an exit row can contain transaction cost\n        # even though current exposure is already zero.\n        nav *= 1.0 + ret\n        if prev > 0 and current <= 0:\n            gain = nav - entry_nav\n            rate = slovenia_rate_for_dates(entry_date, trade_date)\n''')

          Path('gex-lab/tests/test_entry_gap_causality.py').write_text('''\nimport numpy as np\nimport pandas as pd\n\nfrom gex_lab import backtest as bt\n\n\ndef test_pending_cross_is_cancelled_if_next_open_loses_locked_ptrans():\n    idx = pd.date_range("2026-01-05", periods=4, freq="B", tz="UTC")\n    # Day 1 closes through pTrans=100, but day 2 gaps back below it. The thesis\n    # is no longer confirmed at executable time, so no position may be opened.\n    close = [99.0, 101.0, 99.0, 103.0]\n    opens = [99.0, 100.0, 99.0, 102.0]\n    df = pd.DataFrame({\n        "open": opens, "high": [99.5, 101.5, 105.0, 104.0],\n        "low": [98.5, 99.5, 98.0, 101.0], "close": close,\n        "ptrans": [100.0] * 4, "ntrans": [90.0] * 4,\n        "pos_gex": [110.0] * 4, "cotmp": [95.0] * 4,\n    }, index=idx)\n    assert bt.simulate(df) == []\n'''.lstrip())

          Path('alpaca-bot/tests/test_tax_execution_dates.py').write_text('''\nimport pandas as pd\n\nimport bot.taxes as tx\n\n\ndef test_binary_tax_uses_the_prior_close_as_acquisition_and_disposal_date(monkeypatch):\n    idx = pd.DatetimeIndex([\n        pd.Timestamp("2020-01-03", tz="UTC"),\n        pd.Timestamp("2020-01-06", tz="UTC"),\n        pd.Timestamp("2025-01-03", tz="UTC"),\n        pd.Timestamp("2025-01-06", tz="UTC"),\n    ])\n    returns = pd.Series([0.0, 0.01, 0.10, -0.001], index=idx)\n    held = pd.Series([0.0, 1.0, 1.0, 0.0], index=idx)\n    seen = []\n\n    def capture(acquired, disposed):\n        seen.append((pd.Timestamp(acquired), pd.Timestamp(disposed)))\n        return 0.20\n\n    monkeypatch.setattr(tx, "slovenia_rate_for_dates", capture)\n    tx.after_tax_binary_strategy(returns, held)\n    assert seen == [(idx[0], idx[2])]\n'''.lstrip())
          PY

      - name: Install targeted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r alpaca-bot/requirements.txt -r alpaca-bot/requirements-dev.txt
          python -m pip install -r gex-lab/requirements.txt

      - name: Run focused regressions
        run: |
          PYTHONPATH=alpaca-bot python -m pytest -q alpaca-bot/tests/test_tax_execution_dates.py alpaca-bot/tests/test_tax_calendar_edges.py
          PYTHONPATH=gex-lab python -m pytest -q gex-lab/tests/test_entry_gap_causality.py gex-lab/tests/test_backtest.py

      - name: Commit only after regressions pass
        run: |
          rm -f .github/workflows/one-time-timing-precision.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix executable GEX gap and tax trade-date timing'
          git push origin HEAD:agent/fix-repo-audit
