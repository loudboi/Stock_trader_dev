name: Claude Review Repair

on:
  push:
    branches: [agent/fix-repo-audit]
    paths:
      - .github/workflows/claude-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            alpaca-bot/requirements.txt
            alpaca-bot/requirements-ibkr.txt
            alpaca-bot/requirements-dev.txt
      - name: Materialize reviewed repair patch
        shell: bash
        run: |
          cat > /tmp/repair.b64 <<'EOF'
          