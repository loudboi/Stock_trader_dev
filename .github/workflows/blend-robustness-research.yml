name: Blend Robustness Research

on:
  pull_request:
    branches: [agent/fix-repo-audit]
    paths:
      - .github/workflows/blend-robustness-research.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: alpaca-bot
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/profitability-research
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            alpaca-bot/requirements.txt
            alpaca-bot/requirements-backtest.txt
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-backtest.txt
      - name: Rank blends on development data then score holdout once
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          from itertools import combinations
          import numpy as np
          import pandas as pd

          import bot.lab as lab
          import bot.momentum_rotation as mr
          import bot.trend_exposure as te
          from bot.backtest_pullback import INITIAL_EQUITY, buy_hold_combined, compute_metrics, fetch_all
          from bot.data import clean_daily_data

          SYMBOLS = ["SPY", "QQQ", "GLD", "TLT", "EFA", "EEM", "IWM"]
          START = pd.Timestamp("2004-01-01", tz="UTC")
          END = pd.Timestamp("2026-08-20", tz="UTC")
          DEV_WINDOWS = [
              (pd.Timestamp("2006-01-01", tz="UTC"), pd.Timestamp("2009-12-31", tz="UTC")),
              (pd.Timestamp("2010-01-01", tz="UTC"), pd.Timestamp("2014-12-31", tz="UTC")),
              (pd.Timestamp("2015-01-01", tz="UTC"), pd.Timestamp("2019-12-31", tz="UTC")),
              (pd.Timestamp("2020-01-01", tz="UTC"), pd.Timestamp("2024-12-31", tz="UTC")),
          ]
          HOLDOUT = (pd.Timestamp("2025-01-01", tz="UTC"), END)

          daily, _, _ = fetch_all(SYMBOLS, "none", START, END, source="yahoo")
          if set(daily) != set(SYMBOLS):
              raise RuntimeError(f"Missing Yahoo data: expected {SYMBOLS}, got {sorted(daily)}")
          daily = clean_daily_data(daily)
          panel = lab.build_panel(daily)

          def metrics(rets, start, end):
              r = rets.loc[start:end].fillna(0.0)
              eq = INITIAL_EQUITY * (1.0 + r).cumprod()
              eq.attrs["initial_equity"] = INITIAL_EQUITY
              m = compute_metrics([], eq)
              if len(eq) > 1:
                  years = max((eq.index[-1] - eq.index[0]).total_seconds() / (365.2425 * 86400), 1/365.2425)
                  m["cagr"] = (eq.iloc[-1] / INITIAL_EQUITY) ** (1 / years) - 1
              else:
                  m["cagr"] = 0.0
              return m

          def fixed_mean(series):
              return pd.concat(series, axis=1).fillna(0.0).sum(axis=1) / len(series)

          def components(slip):
              te.SLIPPAGE = slip
              mr.SLIPPAGE = slip
              lab.SLIPPAGE = slip
              trend150 = fixed_mean([
                  te.strategy_returns(d, 150, 0.0, 1.0, 0.0) for d in daily.values()])
              trend200 = fixed_mean([
                  te.strategy_returns(d, 200, 0.01, 1.0, 0.0) for d in daily.values()])
              mom9 = mr.portfolio_returns(panel, mr.weight_panel(panel, 9, 1, 3))
              mom6 = mr.portfolio_returns(panel, mr.weight_panel(panel, 6, 0, 3))
              return {
                  "trend150": trend150,
                  "trend200b1": trend200,
                  "mom9s1k3": mom9,
                  "mom6s0k3": mom6,
                  "invvol60": lab.inverse_vol(panel, 60),
                  "minvar60": lab.min_var(panel, 60),
                  "minvar126": lab.min_var(panel, 126),
              }

          base = components(0.0005)
          specs = []
          for a, b in combinations(base, 2):
              for wa in (0.25, 0.50, 0.75):
                  specs.append((f"{wa:.0%}{a}+{1-wa:.0%}{b}", {a: wa, b: 1-wa}))
          specs += [
              ("equal3 trend150+mom9+invvol60", {"trend150": 1/3, "mom9s1k3": 1/3, "invvol60": 1/3}),
              ("equal3 trend200+mom9+minvar60", {"trend200b1": 1/3, "mom9s1k3": 1/3, "minvar60": 1/3}),
              ("equal3 trend150+mom6+minvar60", {"trend150": 1/3, "mom6s0k3": 1/3, "minvar60": 1/3}),
              ("equal4 trend150+trend200+mom9+minvar60", {"trend150": .25, "trend200b1": .25, "mom9s1k3": .25, "minvar60": .25}),
          ]
          for name in base:
              specs.append((name, {name: 1.0}))

          def combine(comp, weights):
              frame = pd.concat({k: comp[k] for k in weights}, axis=1).fillna(0.0)
              return (frame * pd.Series(weights)).sum(axis=1)

          ranked = []
          for name, weights in specs:
              r = combine(base, weights)
              seg = [metrics(r, a, b) for a, b in DEV_WINDOWS]
              ss = [m["sharpe"] for m in seg]
              cc = [m["cagr"] for m in seg]
              dd = [m["max_drawdown"] for m in seg]
              ranked.append({
                  "name": name, "weights": weights,
                  "positive": sum(x > 0 for x in ss),
                  "min_sharpe": min(ss),
                  "median_sharpe": float(np.median(ss)),
                  "mean_sharpe": float(np.mean(ss)),
                  "median_cagr": float(np.median(cc)),
                  "worst_dd": min(dd),
              })
          ranked.sort(key=lambda x: (x["positive"], x["min_sharpe"], x["median_sharpe"], x["median_cagr"]), reverse=True)

          print("DEVELOPMENT BLEND ROBUSTNESS 2006-2024")
          for i, x in enumerate(ranked[:20], 1):
              print(f"{i:02d} {x['name']} pos={x['positive']}/4 minS={x['min_sharpe']:.2f} "
                    f"medS={x['median_sharpe']:.2f} meanS={x['mean_sharpe']:.2f} "
                    f"medCAGR={x['median_cagr']:.2%} worstDD={x['worst_dd']:.2%}")

          # Holdout is scored only after the development ranking is fixed.
          print("\nHELD-OUT 2025-01-01 -> 2026-08-20")
          for x in ranked[:12]:
              m = metrics(combine(base, x["weights"]), *HOLDOUT)
              print(f"{x['name']} Sharpe={m['sharpe']:.2f} CAGR={m['cagr']:.2%} "
                    f"Return={m['total_return']:.2%} DD={m['max_drawdown']:.2%}")

          print("\nCOMPONENT CORRELATIONS 2006-2024")
          dev = pd.concat(base, axis=1).loc[DEV_WINDOWS[0][0]:DEV_WINDOWS[-1][1]]
          print(dev.corr().round(3).to_string())

          print("\nCOST STRESS: TOP 6 DEVELOPMENT-RANKED BLENDS")
          for slip in (0.0005, 0.0010, 0.0020):
              comp = components(slip)
              for x in ranked[:6]:
                  m = metrics(combine(comp, x["weights"]), *HOLDOUT)
                  print(f"slip={slip*10000:.0f}bp {x['name']} Sharpe={m['sharpe']:.2f} "
                        f"CAGR={m['cagr']:.2%} Return={m['total_return']:.2%} DD={m['max_drawdown']:.2%}")

          print("\nEXPLICIT MIN-VAR HOLDOUT")
          for name in ("minvar60", "minvar126"):
              m = metrics(base[name], *HOLDOUT)
              print(f"{name} Sharpe={m['sharpe']:.2f} CAGR={m['cagr']:.2%} "
                    f"Return={m['total_return']:.2%} DD={m['max_drawdown']:.2%}")

          for title, window in (("DEVELOPMENT", (pd.Timestamp("2006-01-01", tz="UTC"), pd.Timestamp("2024-12-31", tz="UTC"))),
                                ("HELD-OUT", HOLDOUT)):
              bh = buy_hold_combined(daily, begin_ts=window[0])
              bh = bh[bh.index <= window[1]]
              m = compute_metrics([], bh)
              years = max((bh.index[-1] - bh.index[0]).total_seconds() / (365.2425 * 86400), 1/365.2425)
              cagr = (bh.iloc[-1] / INITIAL_EQUITY) ** (1 / years) - 1
              print(f"\n{title} B&H Sharpe={m['sharpe']:.2f} CAGR={cagr:.2%} "
                    f"Return={m['total_return']:.2%} DD={m['max_drawdown']:.2%}")
          PY
