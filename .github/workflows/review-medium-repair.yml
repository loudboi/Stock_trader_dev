name: Review Medium Repair

on:
  push:
    branches: [agent/fix-repo-audit]
    paths:
      - .github/workflows/review-medium-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-repo-audit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            alpaca-bot/requirements.txt
            alpaca-bot/requirements-ibkr.txt
            alpaca-bot/requirements-dev.txt
      - name: Install dependencies
        working-directory: alpaca-bot
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ibkr.txt -r requirements-dev.txt
      - name: Apply medium-finding repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              s = read(path)
              n = s.count(old)
              if n != 1:
                  raise RuntimeError(f"{path}: expected one occurrence, found {n}: {old[:100]!r}")
              write(path, s.replace(old, new, 1))

          config = "alpaca-bot/config.py"
          replace_once(
              config,
              "MAX_GROSS_EXPOSURE = 1.00\n",
              "MAX_GROSS_EXPOSURE = 1.00\nPULLBACK_DAILY_WARMUP_DAYS = 320\n",
          )

          bt = "alpaca-bot/bot/backtest_pullback.py"
          replace_once(
              bt,
              "_DAILY_WARMUP_DAYS = 320",
              "_DAILY_WARMUP_DAYS = config.PULLBACK_DAILY_WARMUP_DAYS",
          )

          live = "alpaca-bot/bot/live_pullback.py"
          replace_once(live, "from bot.backtest_pullback import _DAILY_WARMUP_DAYS\n", "")
          s = read(live)
          count = s.count("_DAILY_WARMUP_DAYS")
          if count < 2:
              raise RuntimeError(f"expected live warmup references, found {count}")
          write(live, s.replace("_DAILY_WARMUP_DAYS", "config.PULLBACK_DAILY_WARMUP_DAYS"))

          replace_once(
              live,
              '''        if external_mismatch:\n            pos["external_overlap"] = True\n            pos["tranches"] = len(self.params.tranches)\n            pos["fill_search_since"] = datetime.now(timezone.utc).isoformat()\n''',
              '''        if external_mismatch:\n            pos["external_overlap"] = True\n            pos["manual_reconciliation_required"] = True\n            pos["tranches"] = len(self.params.tranches)\n            pos["fill_search_since"] = datetime.now(timezone.utc).isoformat()\n''',
          )
          replace_once(
              live,
              '''        elif external_mismatch:\n            label = (\n                f"BUY {name}: bot filled {filled_qty}, but broker quantity changed by "\n                f"{broker_delta}; external overlap detected and position frozen")\n''',
              '''        elif external_mismatch:\n            label = (\n                f"BUY {name}: bot filled {filled_qty}, but broker quantity changed by "\n                f"{broker_delta}; external/manual ownership overlap detected. The full broker "\n                "long is temporarily protected, further strategy adds are blocked, and manual "\n                "reconciliation is required before discretionary strategy closes.")\n''',
          )
          replace_once(
              live,
              '''        pos["externally_adjusted"] = True\n        pos["external_adjustment_at"] = adjusted_at\n        pos["fill_search_since"] = adjusted_at\n''',
              '''        pos["externally_adjusted"] = True\n        pos["manual_reconciliation_required"] = True\n        pos["external_adjustment_at"] = adjusted_at\n        pos["fill_search_since"] = adjusted_at\n''',
          )
          replace_once(
              live,
              '''            f"{broker['qty']}@{broker['avg_entry']:.4f}; treating as fully built and "\n            "blocking further strategy adds" +\n''',
              '''            f"{broker['qty']}@{broker['avg_entry']:.4f}; ownership is ambiguous, so the "\n            "full broker long is temporarily protected, further strategy adds are blocked, and "\n            "manual reconciliation is required before discretionary strategy closes" +\n''',
          )
          replace_once(
              live,
              '''        if not pos:\n            return False\n        old_stop = pos.get("stop_order_id")\n''',
              '''        if not pos:\n            return False\n        if pos.get("manual_reconciliation_required") and not reason.startswith("volatility stop"):\n            self.notify(\n                f"CLOSE BLOCKED {name}: broker ownership changed outside attributable bot orders; "\n                "manual reconciliation is required before a discretionary strategy close.")\n            return False\n        old_stop = pos.get("stop_order_id")\n''',
          )
          replace_once(
              live,
              '''    def _finalize_external_close(self, name, inst, pos):\n        if not self._release_protective_stop_after_flat(name, pos):\n            return False\n        since = pos.get("fill_search_since") or pos.get("entry_time")\n        exit_px = self.pf.recent_fill_price(inst, "sell", since=since)\n        if exit_px is None:\n            self._log_trade(\n                name, pos, None, None,\n                "broker stop / external close (fill unavailable; PnL not accrued)", None)\n        else:\n            pnl = (exit_px - pos["avg_entry"]) * pos["qty"]\n            self._log_trade(\n                name, pos, exit_px, pnl, "broker stop / external close", None)\n            self._accrue_daily(pnl)\n''',
              '''    def _finalize_external_close(self, name, inst, pos):\n        stop_id = pos.get("stop_order_id")\n        if not self._release_protective_stop_after_flat(name, pos):\n            return False\n\n        # A generic recent SELL is not sufficient attribution: it may be an older\n        # partial/manual order, and host-clock boundaries are not broker evidence.\n        # Only an exact protective stop confirmed FILLED can supply realized P&L.\n        exit_px = None\n        exact_exit_order_id = None\n        if stop_id:\n            status = self._order_status(stop_id)\n            if status and str(status.get("status", "")).lower() == "filled":\n                exit_px = self.pf.recent_fill_price(inst, "sell", order_id=stop_id)\n                if exit_px is not None:\n                    exact_exit_order_id = stop_id\n        if exit_px is None:\n            self._log_trade(\n                name, pos, None, None,\n                "broker stop / external close (exact fill unavailable; PnL not accrued)", None)\n        else:\n            pnl = (exit_px - pos["avg_entry"]) * pos["qty"]\n            self._log_trade(\n                name, pos, exit_px, pnl, "broker protective stop fill", exact_exit_order_id)\n            self._accrue_daily(pnl)\n''',
          )

          taxes = "alpaca-bot/bot/taxes.py"
          replace_once(
              taxes,
              '''def slovenia_rate_for_holding(hold_days: float, schedule=SLOVENIA_SCHEDULE) -> float:\n    """Compatibility helper when callers only have a duration, not transaction dates."""\n    if hold_days < 0:\n        raise ValueError("hold_days cannot be negative")\n    years = hold_days / 365.2425\n    if years < 5:\n        return 0.25\n    if years < 10:\n        return 0.20\n    if years < 15:\n        return 0.15\n    return 0.0\n''',
              '''def _normalized_schedule(schedule):\n    try:\n        rows = tuple((float(days), float(rate)) for days, rate in schedule)\n    except (TypeError, ValueError) as e:\n        raise ValueError("schedule must contain (holding_days, rate) pairs") from e\n    if not rows:\n        raise ValueError("schedule cannot be empty")\n    prev = -1.0\n    for days, rate in rows:\n        if days <= prev or days <= 0:\n            raise ValueError("schedule holding-day cutoffs must be positive and strictly increasing")\n        if not 0 <= rate <= 1:\n            raise ValueError("schedule rates must be in [0, 1]")\n        prev = days\n    return rows\n\n\ndef slovenia_rate_for_holding(hold_days: float, schedule=SLOVENIA_SCHEDULE) -> float:\n    """Duration-only compatibility helper honoring the supplied scenario schedule."""\n    if hold_days < 0:\n        raise ValueError("hold_days cannot be negative")\n    for cutoff_days, rate in _normalized_schedule(schedule):\n        if hold_days < cutoff_days:\n            return rate\n    return 0.0\n\n\ndef _rate_for_disposal(acquired, disposed, schedule=SLOVENIA_SCHEDULE) -> float:\n    """Use legal calendar anniversaries for the default schedule; custom schedules use days."""\n    normalized = _normalized_schedule(schedule)\n    if normalized == tuple((float(d), float(r)) for d, r in SLOVENIA_SCHEDULE):\n        return slovenia_rate_for_dates(acquired, disposed)\n    a, d = _ts(acquired), _ts(disposed)\n    if d < a:\n        raise ValueError("disposed must not precede acquired")\n    hold_days = (d - a).total_seconds() / 86400.0\n    return slovenia_rate_for_holding(hold_days, normalized)\n''',
          )
          replace_once(
              taxes,
              "    rate = slovenia_rate_for_dates(equity.index[0], equity.index[-1])\n",
              "    rate = _rate_for_disposal(equity.index[0], equity.index[-1], schedule)\n",
          )
          replace_once(
              taxes,
              "def after_tax_binary_strategy(returns: pd.Series, held: pd.Series,\n                              initial: float = 100_000.0) -> pd.Series:\n",
              "def after_tax_binary_strategy(returns: pd.Series, held: pd.Series,\n                              initial: float = 100_000.0,\n                              schedule=SLOVENIA_SCHEDULE) -> pd.Series:\n",
          )
          replace_once(
              taxes,
              "            rate = slovenia_rate_for_dates(entry_date, trade_date)\n",
              "            rate = _rate_for_disposal(entry_date, trade_date, schedule)\n",
          )
          replace_once(
              taxes,
              "    return after_tax_binary_strategy(returns, h, initial)\n",
              "    return after_tax_binary_strategy(returns, h, initial, schedule=schedule)\n",
          )

          aftertax = "alpaca-bot/bot/aftertax.py"
          replace_once(
              aftertax,
              '''    merged = pd.concat(parts, axis=1).sort_index().ffill()\n    out = merged.sum(axis=1)\n    out.attrs["initial_equity"] = initial\n    return out\n''',
              '''    merged = pd.concat(parts, axis=1).sort_index().ffill()\n    # Never sum partial sleeve capital before every sleeve actually exists. Doing\n    # so makes the curve begin below declared initial equity and fabricates a\n    # drawdown/capital jump when a later-inception sleeve first appears.\n    merged = merged.dropna(how="any")\n    out = merged.sum(axis=1, min_count=len(parts))\n    out.attrs["initial_equity"] = initial\n    return out\n''',
          )

          tax_test = "alpaca-bot/tests/test_taxes.py"
          with open(tax_test, "a") as f:
              f.write(textwrap.dedent('''\n\n\ndef test_custom_tax_schedule_is_honored_by_buy_hold_and_duration_helper():\n    custom = ((10_000, 0.99),)\n    assert tx.slovenia_rate_for_holding(100, custom) == 0.99\n    r = _returns("2020-01-01", "2021-01-01", 1.10)\n    baseline = tx.after_tax_buy_hold(r)\n    stressed = tx.after_tax_buy_hold(r, schedule=custom)\n    assert stressed.iloc[-1] < baseline.iloc[-1]\n    assert abs(stressed.iloc[-1] - 100_100.0) < 3.0\n\n\ndef test_invalid_custom_tax_schedule_is_rejected():\n    with pytest.raises(ValueError):\n        tx.slovenia_rate_for_holding(100, ((10, 0.2), (5, 0.1)))\n    with pytest.raises(ValueError):\n        tx.slovenia_rate_for_holding(100, ((10, 1.5),))\n'''))

          aftertax_test = "alpaca-bot/tests/test_aftertax.py"
          with open(aftertax_test, "a") as f:
              f.write(textwrap.dedent('''\n\n\ndef test_te_after_tax_staggered_inception_does_not_create_partial_capital(monkeypatch):\n    idx_a = pd.date_range("2020-01-01", periods=5, freq="D", tz="UTC")\n    idx_b = pd.date_range("2020-01-03", periods=3, freq="D", tz="UTC")\n    data = {\n        "A": pd.DataFrame({"close": 100.0}, index=idx_a),\n        "B": pd.DataFrame({"close": 100.0}, index=idx_b),\n    }\n    monkeypatch.setattr(\n        aftertax, "_te_held_by_symbol",\n        lambda d: {name: pd.Series(1.0, index=df.index) for name, df in d.items()})\n    monkeypatch.setattr(\n        aftertax.te, "strategy_returns",\n        lambda daily, *args: pd.Series(0.0, index=daily.index))\n    monkeypatch.setattr(\n        aftertax.tx, "after_tax_binary_strategy",\n        lambda returns, held, initial=100_000.0, **kwargs:\n            pd.Series(float(initial), index=returns.index))\n\n    eq = aftertax._te_after_tax_equity(data, idx_a[0], idx_a[-1], initial=100_000.0)\n    assert eq.index[0] == idx_b[0]\n    assert np.allclose(eq.values, 100_000.0)\n    assert eq.attrs["initial_equity"] == 100_000.0\n'''))

          boundary_test = "alpaca-bot/tests/test_external_fill_search_boundary.py"
          replace_once(
              boundary_test,
              '''def test_finalize_external_close_uses_latest_fill_search_boundary(tmp_path, monkeypatch):\n    pf = BoundaryPortfolio()\n    t = _trader(tmp_path, pf)\n    pos = _position()\n    pos["fill_search_since"] = "2026-08-10T12:34:56+00:00"\n    t.state["positions"]["SPY"] = pos\n    monkeypatch.setattr(lp, "PULLBACK_TRADES_CSV", str(tmp_path / "trades.csv"))\n    t._finalize_external_close("SPY", t.instruments["SPY"], pos)\n    assert pf.seen_since == "2026-08-10T12:34:56+00:00"\n''',
              '''def test_finalize_external_close_does_not_attribute_generic_recent_sell(tmp_path, monkeypatch):\n    pf = BoundaryPortfolio()\n    t = _trader(tmp_path, pf)\n    pos = _position()\n    pos["fill_search_since"] = "2026-08-10T12:34:56+00:00"\n    t.state["positions"]["SPY"] = pos\n    monkeypatch.setattr(lp, "PULLBACK_TRADES_CSV", str(tmp_path / "trades.csv"))\n    t._finalize_external_close("SPY", t.instruments["SPY"], pos)\n    assert pf.seen_since is None\n''',
          )

          audit_test = "alpaca-bot/tests/test_live_fill_auditability.py"
          with open(audit_test, "a") as f:
              f.write(textwrap.dedent('''\n\n\ndef test_external_flat_uses_exact_filled_stop_order_when_available(tmp_path, monkeypatch):\n    trader, pf, trades = _trader(tmp_path, monkeypatch)\n    pos = _position()\n    pos.update({"stop_order_id": "stop-filled", "stop_level": 95.0, "stop_qty": 10.0})\n    trader.state["positions"]["SPY"] = pos\n    pf.fill = 94.5\n    pf.cancel_order = lambda order_id: False\n    pf.order_status = lambda order_id: {\n        "status": "filled", "terminal": True, "filled_qty": 10.0, "qty": 10.0}\n\n    trader._finalize_external_close("SPY", trader.instruments["SPY"], pos)\n\n    with open(trades, newline="") as fh:\n        row = next(csv.DictReader(fh))\n    assert row["exit_order_id"] == "stop-filled"\n    assert float(row["exit_price"]) == 94.5\n    assert float(row["pnl"]) == -55.0\n    assert trader.state["daily"]["realized"] == -55.0\n'''))
          PY
          python -m py_compile \
            alpaca-bot/config.py \
            alpaca-bot/bot/live_pullback.py \
            alpaca-bot/bot/backtest_pullback.py \
            alpaca-bot/bot/taxes.py \
            alpaca-bot/bot/aftertax.py
          git diff --check
          git diff --stat
      - name: Run targeted regressions
        working-directory: alpaca-bot
        run: |
          python -m pytest -q \
            tests/test_taxes.py \
            tests/test_aftertax.py \
            tests/test_live_fill_auditability.py \
            tests/test_external_fill_search_boundary.py \
            tests/test_live_pullback.py \
            tests/test_independent_review_regressions.py \
            tests/test_backtest_pullback.py
      - name: Run full alpaca-bot suite
        working-directory: alpaca-bot
        run: python -m pytest -q
      - name: Commit repairs and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/review-medium-repair.yml
          git add alpaca-bot
          git commit -m "Resolve independent review accounting and attribution findings"
          git push origin HEAD:agent/fix-repo-audit
