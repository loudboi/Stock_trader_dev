name: Final audit verification

on:
  push:
    branches: [agent/fix-repo-audit]
    paths: [.github/workflows/final-audit-verification.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-repo-audit
          fetch-depth: 0

      - name: Assert repair workflows are cleaned and partial-fill hardening landed
        run: |
          set -euo pipefail
          extras=$(find .github/workflows -maxdepth 1 -type f -name 'one-time-*.yml' -print)
          if [ -n "$extras" ]; then
            echo "Temporary repair workflow(s) remain:" >&2
            echo "$extras" >&2
            exit 1
          fi
          grep -q 'def _settle_partial_buy' alpaca-bot/bot/live_pullback.py
          grep -q 'def _settle_partial_close' alpaca-bot/bot/live_pullback.py
          grep -q 'def order_status' alpaca-bot/bot/portfolio.py
          grep -q 'def order_status' alpaca-bot/bot/portfolio_ibkr.py
          grep -q 'test_terminal_partial_buy_is_frozen_and_protected' alpaca-bot/tests/test_live_pullback.py
          grep -q 'Timedelta(nanoseconds=1)' alpaca-bot/bot/backtest_pullback.py
          grep -q 'BDay(1)' alpaca-bot/bot/taxes.py
          grep -q 'CHRONOLOGICAL CONSISTENCY' alpaca-bot/tests/test_lab.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            alpaca-bot/requirements.txt
            alpaca-bot/requirements-ibkr.txt
            alpaca-bot/requirements-dev.txt
      - name: Test alpaca-bot on Python 3.11
        working-directory: alpaca-bot
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ibkr.txt -r requirements-dev.txt
          python -m pytest -q | tee /tmp/alpaca-311.txt

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            alpaca-bot/requirements.txt
            alpaca-bot/requirements-ibkr.txt
            alpaca-bot/requirements-dev.txt
            gex-lab/requirements.txt
      - name: Test alpaca-bot on Python 3.12
        working-directory: alpaca-bot
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ibkr.txt -r requirements-dev.txt
          python -m pytest -q | tee /tmp/alpaca-312.txt
      - name: Test gex-lab on Python 3.12
        working-directory: gex-lab
        run: |
          python -m pip install -r requirements.txt 'pytest>=8,<10'
          python -m pytest -q | tee /tmp/gex-312.txt

      - name: Write immutable verification record and remove this one-shot gate
        run: |
          set -euo pipefail
          verified=$(git rev-parse HEAD)
          cat > VERIFICATION.md <<EOF
          # Verification record

          This file was created automatically only after the final audit gate passed.

          Verified source commit before this record: \\`$verified\`

          Gate conditions:

          - no temporary \\`one-time-*.yml\\` repair workflow remained;
          - terminal partial-buy/partial-close reconciliation and broker order-status
            adapters were present;
          - max-drawdown initial-NAV, tax-calendar, and consistency-label regressions
            were present;
          - full \\`alpaca-bot\\` pytest suite passed on Python 3.11;
          - full \\`alpaca-bot\\` pytest suite passed on Python 3.12;
          - full \\`gex-lab\\` pytest suite passed on Python 3.12.

          Pytest summaries:

          \\`\\`\\`text
          alpaca-bot / Python 3.11
          $(tail -n 3 /tmp/alpaca-311.txt)

          alpaca-bot / Python 3.12
          $(tail -n 3 /tmp/alpaca-312.txt)

          gex-lab / Python 3.12
          $(tail -n 3 /tmp/gex-312.txt)
          \\`\\`\\`

          This is test verification, not a guarantee of profitable or failure-free live
          trading. Broker, market-data, legal/tax, and market-microstructure assumptions
          remain subject to the limitations documented in the repository.
          EOF
          git rm .github/workflows/final-audit-verification.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERIFICATION.md
          git diff --cached --check
          git commit -m 'Record final audit verification'
          git push origin HEAD:agent/fix-repo-audit
