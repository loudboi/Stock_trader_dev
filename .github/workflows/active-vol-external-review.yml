name: Active volatility external review

on:
  push:
    branches:
      - agent/active-alpha-external-review
  pull_request:
    branches:
      - agent/active-alpha-research
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: alpaca-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            alpaca-bot/requirements.txt
            alpaca-bot/requirements-backtest.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-backtest.txt
      - name: Run external-review validation
        run: python research/active_vol_managed_external_review.py | tee external_review_results.txt
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: active-vol-external-review
          path: |
            alpaca-bot/external_review_results.txt
            alpaca-bot/external_review_active_exposure.csv
            alpaca-bot/external_review_summary.json
