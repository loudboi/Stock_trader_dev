name: Active volatility external review

on:
  push:
    branches:
      - agent/active-alpha-external-review
  pull_request:
    branches:
      - agent/active-alpha-research
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[review-results]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: alpaca-bot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            alpaca-bot/requirements.txt
            alpaca-bot/requirements-backtest.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-backtest.txt
      - name: Run continuous external-review validation
        run: python research/active_vol_managed_external_review.py | tee external_review_results.txt
      - name: Run crisis round-trip and drifted-margin attribution
        run: python research/active_vol_roundtrip_attribution.py | tee external_review_roundtrip_results.txt
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: active-vol-external-review
          path: |
            alpaca-bot/external_review_results.txt
            alpaca-bot/external_review_active_exposure.csv
            alpaca-bot/external_review_summary.json
            alpaca-bot/external_review_roundtrip_results.txt
            alpaca-bot/external_review_margin_drift.csv
            alpaca-bot/external_review_roundtrip.json
      - name: Publish results on isolated review branch
        if: github.event_name == 'push'
        working-directory: .
        run: |
          mkdir -p external-review-results
          cp alpaca-bot/external_review_results.txt external-review-results/results.txt
          cp alpaca-bot/external_review_active_exposure.csv external-review-results/active_exposure.csv
          cp alpaca-bot/external_review_summary.json external-review-results/summary.json
          cp alpaca-bot/external_review_roundtrip_results.txt external-review-results/roundtrip_results.txt
          cp alpaca-bot/external_review_margin_drift.csv external-review-results/margin_drift.csv
          cp alpaca-bot/external_review_roundtrip.json external-review-results/roundtrip.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add external-review-results
          if git diff --cached --quiet; then
            echo 'No result changes to publish.'
            exit 0
          fi
          git commit -m 'Publish external review results [review-results]'
          git push origin HEAD:agent/active-alpha-external-review