name: Final Candidate Validation

on:
  pull_request:
    branches: [agent/fix-repo-audit]
    paths:
      - .github/workflows/final-candidate-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: alpaca-bot
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/profitability-research
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            alpaca-bot/requirements.txt
            alpaca-bot/requirements-backtest.txt
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-backtest.txt
      - name: Validate fixed candidates
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd

          import bot.lab as lab
          import bot.momentum_rotation as mr
          import bot.trend_exposure as te
          from bot.backtest_pullback import INITIAL_EQUITY, buy_hold_combined, compute_metrics, fetch_all
          from bot.data import clean_daily_data

          SYMBOLS = ["SPY", "QQQ", "GLD", "TLT", "EFA", "EEM", "IWM"]
          START = pd.Timestamp("2004-01-01", tz="UTC")
          DEV_START = pd.Timestamp("2006-01-01", tz="UTC")
          DEV_END = pd.Timestamp("2024-12-31", tz="UTC")
          HOLD_START = pd.Timestamp("2025-01-01", tz="UTC")
          END = pd.Timestamp("2026-08-20", tz="UTC")
          SLIP = 0.0020  # deliberately harsh: 20 bps per modeled fill/turnover event
          RF_STRESS = 0.04

          daily, _, _ = fetch_all(SYMBOLS, "none", START, END, source="yahoo")
          if set(daily) != set(SYMBOLS):
              raise RuntimeError(f"Missing data: {sorted(set(SYMBOLS)-set(daily))}")
          daily = clean_daily_data(daily)

          def build_components(data, slip=SLIP):
              panel = lab.build_panel(data)
              te.SLIPPAGE = slip; mr.SLIPPAGE = slip; lab.SLIPPAGE = slip
              def mean(xs):
                  return pd.concat(xs, axis=1).fillna(0.0).sum(axis=1) / len(xs)
              trend150 = mean([te.strategy_returns(d, 150, 0.0, 1.0, 0.0) for d in data.values()])
              trend200 = mean([te.strategy_returns(d, 200, 0.01, 1.0, 0.0) for d in data.values()])
              mom9 = mr.portfolio_returns(panel, mr.weight_panel(panel, 9, 1, min(3, len(data))))
              minvar60 = lab.min_var(panel, 60)
              return {"trend150": trend150, "trend200": trend200,
                      "mom9": mom9, "minvar60": minvar60}

          def combine(c, w):
              x = pd.concat({k: c[k] for k in w}, axis=1).fillna(0.0)
              return (x * pd.Series(w)).sum(axis=1)

          WEIGHTS = {
              "equal4": {"trend150": .25, "trend200": .25, "mom9": .25, "minvar60": .25},
              "equal3": {"trend200": 1/3, "mom9": 1/3, "minvar60": 1/3},
              "defensive": {"trend200": .75, "minvar60": .25},
          }
          c = build_components(daily)
          returns = {n: combine(c, w) for n, w in WEIGHTS.items()}

          def stats(r, a, b, rf=0.0):
              x = r.loc[a:b].fillna(0.0)
              eq = INITIAL_EQUITY * (1+x).cumprod(); eq.attrs["initial_equity"] = INITIAL_EQUITY
              m = compute_metrics([], eq, risk_free_annual=rf)
              if len(eq) > 1:
                  years = max((eq.index[-1]-eq.index[0]).total_seconds()/(365.2425*86400), 1/365.2425)
                  m["cagr"] = (eq.iloc[-1]/INITIAL_EQUITY)**(1/years)-1
              else:
                  m["cagr"] = 0.0
              return m

          print("FIXED CANDIDATES @ 20bp COST STRESS")
          for n, r in returns.items():
              d = stats(r, DEV_START, DEV_END)
              h = stats(r, HOLD_START, END)
              h_rf = stats(r, HOLD_START, END, RF_STRESS)
              y25 = stats(r, pd.Timestamp("2025-01-01", tz="UTC"), pd.Timestamp("2025-12-31", tz="UTC"))
              y26 = stats(r, pd.Timestamp("2026-01-01", tz="UTC"), END)
              print(f"{n} DEV CAGR={d['cagr']:.2%} S={d['sharpe']:.2f} DD={d['max_drawdown']:.2%} | "
                    f"HOLD CAGR={h['cagr']:.2%} S0={h['sharpe']:.2f} S4={h_rf['sharpe']:.2f} DD={h['max_drawdown']:.2%} | "
                    f"2025 Ret={y25['total_return']:.2%} S={y25['sharpe']:.2f} | 2026YTD Ret={y26['total_return']:.2%} S={y26['sharpe']:.2f}")

          # Rolling 3-year windows, advanced quarterly, all inside development period.
          print("\nROLLING 3-YEAR DEVELOPMENT WINDOWS")
          starts = pd.date_range(DEV_START, pd.Timestamp("2021-12-31", tz="UTC"), freq="QS")
          for n, r in returns.items():
              vals = []
              for a in starts:
                  b = min(a + pd.DateOffset(years=3) - pd.Timedelta(days=1), DEV_END)
                  m = stats(r, a, b)
                  vals.append((m["cagr"], m["sharpe"], m["max_drawdown"]))
              arr = np.asarray(vals)
              print(f"{n} windows={len(vals)} posCAGR={(arr[:,0]>0).mean():.1%} posSharpe={(arr[:,1]>0).mean():.1%} "
                    f"medianCAGR={np.median(arr[:,0]):.2%} p10CAGR={np.quantile(arr[:,0],.10):.2%} "
                    f"minCAGR={arr[:,0].min():.2%} medianS={np.median(arr[:,1]):.2f} minS={arr[:,1].min():.2f} "
                    f"worstDD={arr[:,2].min():.2%}")

          # Nonparametric diagnostic: resample 20-trading-day blocks from DEVELOPMENT only.
          rng = np.random.default_rng(20260821)
          print("\n20-DAY BLOCK BOOTSTRAP, 5-YEAR PATHS FROM DEVELOPMENT RETURNS")
          block = 20; path_n = 252*5; sims = 1000
          for n, r in returns.items():
              x = r.loc[DEV_START:DEV_END].dropna().to_numpy()
              max_start = len(x)-block
              cagrs = []
              for _ in range(sims):
                  pieces = []
                  while sum(len(p) for p in pieces) < path_n:
                      i = int(rng.integers(0, max_start+1))
                      pieces.append(x[i:i+block])
                  path = np.concatenate(pieces)[:path_n]
                  terminal = float(np.prod(1.0+path))
                  cagrs.append(terminal**(1/5)-1)
              a = np.asarray(cagrs)
              print(f"{n} P(5y CAGR>0)={(a>0).mean():.1%} median={np.median(a):.2%} "
                    f"p05={np.quantile(a,.05):.2%} p01={np.quantile(a,.01):.2%}")

          print("\nLEAVE-ONE-ASSET-OUT HOLDOUT @ 20bp")
          for omitted in SYMBOLS:
              sub = {k:v for k,v in daily.items() if k != omitted}
              cc = build_components(sub)
              for n, w in WEIGHTS.items():
                  m = stats(combine(cc, w), HOLD_START, END)
                  print(f"omit={omitted} {n} CAGR={m['cagr']:.2%} S={m['sharpe']:.2f} DD={m['max_drawdown']:.2%}")

          print("\nBENCHMARKS")
          for title, a, b in (("DEV", DEV_START, DEV_END), ("HOLD", HOLD_START, END)):
              bh = buy_hold_combined(daily, begin_ts=a); bh = bh[bh.index <= b]
              m = compute_metrics([], bh, risk_free_annual=RF_STRESS)
              years = max((bh.index[-1]-bh.index[0]).total_seconds()/(365.2425*86400), 1/365.2425)
              cagr = (bh.iloc[-1]/INITIAL_EQUITY)**(1/years)-1
              print(f"{title} equal-weight B&H CAGR={cagr:.2%} Sharpe@4%={m['sharpe']:.2f} DD={m['max_drawdown']:.2%}")
          PY
