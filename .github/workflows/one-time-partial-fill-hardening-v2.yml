name: One-time partial-fill hardening v2

on:
  push:
    branches: [agent/fix-repo-audit]
    paths: [.github/workflows/one-time-partial-fill-hardening-v2.yml]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-repo-audit
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Reuse the exact audited production patch from v1
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/one-time-partial-fill-hardening.yml').read_text()
          marker = '      - name: Apply exact partial-fill hardening\n        run: |\n'
          start = src.index(marker) + len(marker)
          end = src.index('      - name: Install targeted test dependencies\n', start)
          lines = src[start:end].splitlines()
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_partial_patch.sh').write_text(body)
          PY
          bash /tmp/apply_partial_patch.sh
      - name: Make delayed-fill tests bypass timeout policy explicitly
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('alpaca-bot/tests/test_live_pullback.py')
          s = p.read_text()
          old = '''    old_seconds = lp.ORDER_CONFIRM_SECONDS\n    lp.ORDER_CONFIRM_SECONDS = 0.0\n    try:\n        assert not t._buy_tranche("SPY", t.instruments["SPY"], 100.0, 0, 0.05, "test")\n    finally:\n        lp.ORDER_CONFIRM_SECONDS = old_seconds\n'''
          new = '''    t._wait_pending = lambda name, inst, seconds=lp.ORDER_CONFIRM_SECONDS: False\n    assert not t._buy_tranche("SPY", t.instruments["SPY"], 100.0, 0, 0.05, "test")\n'''
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected two delayed-fill timeout blocks, found {count}')
          p.write_text(s.replace(old, new, 2))
          PY
      - name: Install targeted test dependencies
        working-directory: alpaca-bot
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ibkr.txt -r requirements-dev.txt
      - name: Run live and IBKR regression tests before commit
        working-directory: alpaca-bot
        run: python -m pytest -q tests/test_live_pullback.py tests/test_ibkr_adapter.py
      - name: Commit only after targeted tests pass
        run: |
          rm -f .github/workflows/one-time-audit-patch.yml \
                .github/workflows/one-time-audit-refinements.yml \
                .github/workflows/one-time-partial-fill-hardening.yml \
                .github/workflows/one-time-partial-fill-hardening-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden live reconciliation for terminal partial fills"
          git push origin HEAD:agent/fix-repo-audit
