name: One-time audit test patch

on:
  push:
    branches: [agent/fix-repo-audit]
    paths: [.github/workflows/one-time-audit-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-repo-audit
          fetch-depth: 0
      - name: Replace only the stale terminology assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("alpaca-bot/tests/test_lab.py")
          s = p.read_text()
          old = 'assert "WALK-FORWARD" in out and "SUMMARY" in out'
          new = 'assert "CHRONOLOGICAL CONSISTENCY" in out and "no fitting" in out and "SUMMARY" in out'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif new not in s:
              raise SystemExit("Expected stale/current assertion not found; refusing broad edit")
          PY
          git rm .github/workflows/one-time-audit-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpaca-bot/tests/test_lab.py
          git diff --cached --check
          git commit -m "Align lab consistency test with honest terminology"
          git push origin HEAD:agent/fix-repo-audit
